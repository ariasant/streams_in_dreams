# Representative perturbed-host run: a point-mass flyby of a live Plummer host.
# All quantities are in system units (G below); map dt to Myr externally for the
# cadence study. Switch perturber_type to small_satellite for the live-satellite variant.

run_name: sat_run
output_dir: ./runs/sat_N1000
G: 1.0

# --- Cadence (independent) -------------------------------------------------------
dt: 10            # science snapshot cadence  (the variable to vary later)
dt_int: 0.1       # fixed internal integrator step (hold accuracy constant)

# --- Phase A: host ---------------------------------------------------------------
N_host: 1000000
M_host: 1.0
a_host: 1.0        # Plummer scale radius
eps_host: 0.05     # softening
t_relax: 5.0       # burn-in duration
seed: 42
force_method: tree   # 'direct' (exact brute force) or 'tree' (Barnes-Hut, uses theta)
theta: 0.5
parallel: true

# --- Phase B: perturber ----------------------------------------------------------
# The perturber is dropped from rest at separation r_start (zero velocity radial infall).
perturber_type: 'small_satellite'   # 'point_mass' or 'small_satellite'
M_pert: 0.1
r_start: 10.0       # starting separation from the host COM
t_end: 1000.0        # Phase B duration
eps_pert: 0.05
N_pert: 1000        # small_satellite only
a_pert: 0.1        # small_satellite only

# --- Visualization ---------------------------------------------------------------
gif_duration: 60   # wall-clock seconds
gif_fps: 25
gif_max_particles: 5000
num_energy_samples: 120   # energy-conservation sample points (each an O(N^2) solve)
snapshot_phase_a: false
